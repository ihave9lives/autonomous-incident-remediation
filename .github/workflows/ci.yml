name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.22'
  PYTHON_VERSION: '3.12'

jobs:
  go-test:
    name: Go Tests (anomaly-daemon)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./anomaly-daemon
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v ./...

      - name: Build
        run: go build -o anomaly-daemon .

  python-test:
    name: Python Tests (engine)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./engine
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt 2>/dev/null || pip install pytest pytest-asyncio httpx

      - name: Run tests
        run: python -m pytest -v

  eval-test:
    name: Evaluation Harness
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./eval
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest

      - name: Run evaluation suite
        run: python run_eval.py

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linting tools
        run: pip install ruff

      - name: Run ruff
        run: ruff check engine/ eval/ --output-format=github

      - name: Check formatting
        run: ruff format --check engine/ eval/

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Go vet
        run: |
          cd anomaly-daemon
          go vet ./...

      - name: Go fmt check
        run: |
          cd anomaly-daemon
          test -z "$(gofmt -l .)"

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build checkout-service
        uses: docker/build-push-action@v5
        with:
          context: ./demo-app/checkout-service
          push: false
          tags: checkout-service:test
          load: true

      - name: Build payment-service
        uses: docker/build-push-action@v5
        with:
          context: ./demo-app/payment-service
          push: false
          tags: payment-service:test
          load: true

  integration-test:
    name: Integration Test (Docker Compose)
    runs-on: ubuntu-latest
    needs: [go-test, python-test, eval-test, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start services
        run: |
          docker compose up -d
          sleep 30

      - name: Verify services healthy
        run: |
          curl -f http://localhost:8001/health
          curl -f http://localhost:8002/health

      - name: Test fault injection
        run: |
          curl -X POST http://localhost:8001/faults/latency -d '{"latency_ms": 100}'
          curl -f http://localhost:8001/health

      - name: Cleanup
        run: docker compose down